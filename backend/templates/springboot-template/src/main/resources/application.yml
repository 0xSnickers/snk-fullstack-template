spring:
  application:
    name: springboot-template
  # 本地开发可把变量写进 .env（KEY=VALUE），不存在时忽略
  config:
    import: optional:file:.env[.properties]
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/springboot_template}
    username: ${DB_USERNAME:app}
    password: ${DB_PASSWORD:password}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true

server:
  port: ${PORT:9000}
  shutdown: graceful

# 见 docs/API_CONTRACT.md
app:
  jwt-secret: ${JWT_SECRET:}
  access-token-ttl: ${ACCESS_TOKEN_TTL:900}s
  refresh-token-ttl: ${REFRESH_TOKEN_TTL:604800}s
  cookie-secure: ${COOKIE_SECURE:false}
  seed-demo-user: ${SEED_DEMO_USER:false}
  cors-origins: ${CORS_ORIGINS:}

logging:
  file:
    name: ${LOG_FILE:logs/app.log}
  level:
    root: ${LOG_LEVEL:INFO}
  pattern:
    console: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
    file: "%d{yyyy-MM-dd'T'HH:mm:ss.SSSXXX} %-5level [%X{requestId:-}] %logger{36} - %msg%n"
