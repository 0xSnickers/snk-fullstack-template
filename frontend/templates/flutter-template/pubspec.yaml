name: flutter_template
description: Flutter 跨端项目模板（Android / iOS / Web），与 Web / RN / uni-app 模板共享接口约定、语言包和设计 Token。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.8.0
  flutter: '>=3.32.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  dio: ^5.8.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.4
  go_router: ^16.0.0
  intl: any
  shared_preferences: ^2.5.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  # 由 l10n.yaml 配置，从 lib/l10n/*.arb 生成 AppLocalizations
  generate: true
